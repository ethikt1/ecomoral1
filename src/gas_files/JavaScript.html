// Client Helper for google.script.run
function callServer(funcName, ...args) {
  return new Promise((resolve, reject) => {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)[funcName](...args);
    } else {
      // Mock Fallback for local browser testing
      console.warn('google.script.run unavailable. Running simulator mode for:', funcName);
      setTimeout(() => {
        resolve(mockServerResponse(funcName, ...args));
      }, 400);
    }
  });
}

function mockServerResponse(funcName, ...args) {
  if (funcName === 'verifyTeacherPassword') {
    return { success: true };
  }
  if (funcName === 'getStudentProgress') {
    const code = args[0];
    return {
      success: true,
      isNew: true,
      student: {
        submission_id: 'SUB_' + code + '_' + Date.now(),
        student_code: code,
        scenario_id: args[1],
        started_at: new Date().toLocaleString(),
        status: 'IN_PROGRESS',
        attempt_number: 1
      }
    };
  }
  if (funcName === 'savePreAssessment') {
    const payload = args[0];
    const scores = calcClientScores(payload.answers);
    const rec = getLowestComp(scores);
    return { success: true, scores, recommendedActivity: rec };
  }
  if (funcName === 'saveLearningActivity') {
    return { success: true };
  }
  if (funcName === 'savePostAssessment') {
    const payload = args[0];
    const postScores = calcClientScores(payload.answers);
    return { success: true, postScores, preScores: appState.student.preScores };
  }
  if (funcName === 'getTeacherDashboard') {
    return {
      success: true,
      data: {
        dataSource: args[0],
        totalSubmissions: 24,
        completedCount: 20,
        completionRate: 83,
        preAverages: { sensitivity: 2.8, judgment: 3.1, motivation: 2.5, action: 2.2 },
        postAverages: { sensitivity: 4.1, judgment: 4.3, motivation: 3.8, action: 3.6 },
        averageGains: { sensitivity: 1.3, judgment: 1.2, motivation: 1.3, action: 1.4 },
        recommendedDistribution: { sensitivity: 6, judgment: 3, motivation: 7, action: 8 },
        selectedDistribution: { sensitivity: 5, judgment: 4, motivation: 8, action: 7 },
        matchRate: 88,
        records: []
      }
    };
  }
  if (funcName === 'generateSyntheticData') {
    return { success: true, message: '가상 학생 60명 데이터 생성이 완료되었습니다.' };
  }
  return { success: true };
}

function calcClientScores(answers) {
  const getAvg = (qIds) => {
    let sum = 0, cnt = 0;
    qIds.forEach(id => {
      if (answers[id]) { sum += Number(answers[id]); cnt++; }
    });
    return cnt > 0 ? Math.round((sum / cnt) * 10) / 10 : 0;
  };
  return {
    sensitivity: getAvg([1, 2, 3]),
    judgment: getAvg([4, 5, 6]),
    motivation: getAvg([7, 8, 9]),
    action: getAvg([10, 11, 12])
  };
}

function getLowestComp(scores) {
  let minK = 'sensitivity';
  let minV = scores[minK];
  ['judgment', 'motivation', 'action'].forEach(k => {
    if (scores[k] < minV) { minV = scores[k]; minK = k; }
  });
  return minK;
}

function submitStep1() {
  const rawCode = document.getElementById('input-student-code').value;
  const cleanCode = rawCode.trim().replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
  const consent = document.getElementById('check-consent').checked;

  if (cleanCode.length < 4 || cleanCode.length > 12) {
    alert('학습코드는 영문과 숫자를 조합한 4~12자리여야 합니다.');
    return;
  }
  if (!consent) {
    alert('개인정보 수집 및 학습 진행 동의에 체크해주세요.');
    return;
  }

  appState.student.studentCode = cleanCode;
  appState.student.consentChecked = true;

  callServer('getStudentProgress', cleanCode, appState.student.scenarioId)
    .then(res => {
      if (res.success) {
        appState.student.submissionId = res.student.submission_id;
        appState.student.attemptNumber = res.student.attempt_number;
        appState.student.step = 2;
        saveLocalSession();
        renderApp();
      } else {
        alert(res.message);
      }
    });
}

      <form id="pre-form" onsubmit="event.preventDefault(); submitStep3();" class="space-y-6">
        ${ASSESSMENT_QUESTIONS.map((q, idx) => `
          <div class="border-b border-slate-100 pb-4">
            <div class="flex items-center gap-2 mb-2">
              <span class="text-xs font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded">Q${idx + 1} (${q.label})</span>
            </div>
            <p class="text-xs font-medium text-slate-800 mb-3 leading-snug">${q.text}</p>
            <div class="grid grid-cols-5 gap-1 text-center">
              ${[1,2,3,4,5].map(score => `
                <label class="cursor-pointer border rounded-lg py-2 transition-all-200 flex flex-col items-center hover:bg-emerald-50">
                  <input type="radio" name="q_${q.id}" value="${score}" ${appState.student.preAnswers[q.id] == score ? 'checked' : ''} required class="mb-1 text-emerald-600">
                  <span class="text-xs font-semibold text-slate-700">${score}점</span>
                </label>
              `).join('')}
            </div>
          </div>
        `).join('')}

        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl transition-all-200 shadow-sm">
          사전 진단 제출 및 결과 보기 →
        </button>
      </form>
    </div>
  `;
}

function submitStep3() {
  const answers = {};
  ASSESSMENT_QUESTIONS.forEach(q => {
    const checked = document.querySelector(`input[name="q_${q.id}"]:checked`);
    if (checked) answers[q.id] = parseInt(checked.value, 10);
  });

  if (Object.keys(answers).length < 12) {
    alert('12개 모든 문항에 응답해 주셔야 합니다.');
    return;
  }

  appState.student.preAnswers = answers;

  callServer('savePreAssessment', {
    submission_id: appState.student.submissionId,
    student_code: appState.student.studentCode,
    scenario_id: appState.student.scenarioId,
    attempt_number: appState.student.attemptNumber,
    answers: answers
  }).then(res => {
    if (res.success) {
      appState.student.preScores = res.scores;
      appState.student.recommendedActivity = res.recommendedActivity;
      appState.student.selectedActivity = res.recommendedActivity; // default match
      appState.student.step = 4;
      saveLocalSession();
      renderApp();
    } else {
      alert(res.message);
    }
  });
}

              실제 학생 데이터

            <button onclick="switchDataSource('SYNTHETIC')" class="text-xs font-bold py-1.5 px-3 rounded-lg transition-all-200 ${
              source === 'SYNTHETIC' ? 'bg-purple-600 text-white shadow-xs' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
            }">
              가상 연습 데이터
            </button>
          </div>

          <div class="flex items-center gap-2">
            ${source === 'SYNTHETIC' ? `
              <button onclick="promptGenerateSynthetic()" class="text-xs font-bold bg-purple-700 hover:bg-purple-800 text-white px-3 py-2 rounded-lg transition-all-200 shadow-xs">
                ⚡ 가상 학생 60명 생성
              </button>
            ` : ''}
            <button onclick="downloadCsv()" class="text-xs font-bold bg-slate-800 hover:bg-slate-900 text-white px-3 py-2 rounded-lg transition-all-200 shadow-xs">
              📥 CSV 다운로드
            </button>
          </div>
        </div>

        ${!dash ? `
          <div class="text-center py-12 text-slate-500">데이터를 불러오는 중입니다...</div>
        ` : `
          <!-- Summary Cards Grid -->
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
            <div class="app-card p-4 text-center">
              <span class="text-xs font-semibold text-slate-500 block">총 응답 학생 수</span>
              <span class="text-2xl font-extrabold text-slate-800">${dash.totalSubmissions}명</span>
            </div>
            <div class="app-card p-4 text-center">
              <span class="text-xs font-semibold text-slate-500 block">학습 완료율</span>
              <span class="text-2xl font-extrabold text-emerald-600">${dash.completionRate}%</span>
            </div>
            <div class="app-card p-4 text-center">
              <span class="text-xs font-semibold text-slate-500 block">평균 향상도</span>
              <span class="text-2xl font-extrabold text-blue-600">+${dash.averageGains.sensitivity}</span>
            </div>
            <div class="app-card p-4 text-center">
              <span class="text-xs font-semibold text-slate-500 block">추천-선택 일치율</span>
              <span class="text-2xl font-extrabold text-amber-600">${dash.matchRate}%</span>
            </div>
          </div>

          <!-- Component Averages Table -->
          <div class="app-card p-5 mb-6">
            <h3 class="text-sm font-bold text-slate-800 mb-3">4구성요소별 사전 vs 사후 평균 비교</h3>
            <div class="overflow-x-auto">
              <table class="w-full text-xs text-left border-collapse">
                <thead>
                  <tr class="bg-slate-50 border-b border-slate-200">
                    <th class="p-2.5 font-bold">구성요소</th>
                    <th class="p-2.5 font-bold">사전 평균</th>
                    <th class="p-2.5 font-bold">사후 평균</th>
                    <th class="p-2.5 font-bold">평균 향상도</th>
                  </tr>
                </thead>
                <tbody>
                  ${[
                    { name: '도덕적 민감성', pre: dash.preAverages.sensitivity, post: dash.postAverages.sensitivity, gain: dash.averageGains.sensitivity },
                    { name: '도덕적 판단', pre: dash.preAverages.judgment, post: dash.postAverages.judgment, gain: dash.averageGains.judgment },
                    { name: '도덕적 동기화', pre: dash.preAverages.motivation, post: dash.postAverages.motivation, gain: dash.averageGains.motivation },
                    { name: '도덕적 행동', pre: dash.preAverages.action, post: dash.postAverages.action, gain: dash.averageGains.action }
                  ].map(row => `
                    <tr class="border-b border-slate-100 hover:bg-slate-50">
                      <td class="p-2.5 font-semibold text-slate-800">${row.name}</td>
                      <td class="p-2.5 text-slate-600">${row.pre} 점</td>
                      <td class="p-2.5 text-emerald-600 font-bold">${row.post} 점</td>
                      <td class="p-2.5 text-blue-600 font-bold">+${row.gain} 점</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `}
      </main>
    </div>
  `;
}

function loadDashboardData() {
  callServer('getTeacherDashboard', appState.teacher.dataSource)
    .then(res => {
      if (res.success) {
        appState.teacher.dashboardData = res.data;
        renderApp();
      } else {
        alert(res.message);
      }
    });
}

function switchDataSource(source) {
  appState.teacher.dataSource = source;
  loadDashboardData();
}

function promptGenerateSynthetic() {
  if (confirm('가상 학생 60명의 데이터를 생성하시겠습니까?\n주의: 가상 DB(EcoMoral_Synthetic_DB)에만 반영됩니다.')) {
    callServer('generateSyntheticData', 60, 'OVERWRITE')
      .then(res => {
        alert(res.message);
        loadDashboardData();
      });
  }
}

function downloadCsv() {
  callServer('exportCsv', appState.teacher.dataSource)
    .then(res => {
      if (res.success) {
        const blob = new Blob([res.content], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = res.filename;
        link.click();
      } else {
        alert(res.message);
      }
    });
}

function logoutTeacher() {
  appState.teacher.authenticated = false;
  appState.view = 'ROLE_SELECT';
  renderApp();
}
</script>
